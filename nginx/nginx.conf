# Used only in the VPS (docker-compose) deployment where WE terminate TLS
# ourselves with a real certificate. On Railway this file is not used.
# مهم: مسیر گواهی را با دامنه واقعی خودت عوض کن (مثلاً your-domain.com)

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Panel UI + API
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VLESS over WebSocket
    location /hami-ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Trojan over WebSocket
    location /hami-trojan-ws {
        proxy_pass http://127.0.0.1:8446;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # VLESS over XHTTP
    location /hami-xhttp {
        proxy_pass http://127.0.0.1:8445;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# Reality (8444/8447) and Shadowsocks (8448) are exposed directly by Xray.