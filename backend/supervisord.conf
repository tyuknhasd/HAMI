# supervisord config for HAMI — runs xray, mtg, panel (uvicorn), nginx.
[supervisord]
nodaemon=true
user=root

[program:xray]
command=/usr/local/bin/xray run -config /etc/xray/config.json
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# mtg runs INSIDE this container so MTProto works on Railway too.
# It reads /etc/mtg/secrets.toml, which is ALWAYS a valid TOML file thanks to
# the placeholder secret baked in the Dockerfile — so mtg never crashes on boot.
[program:mtg]
command=/usr/local/bin/mtg run /etc/mtg/secrets.toml
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:panel]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir /app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0