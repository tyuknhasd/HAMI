version: "3.9"

services:
  panel:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hami-panel
    restart: unless-stopped
    environment:
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      DATABASE_URL: postgresql://hami:${DB_PASSWORD}@db:5432/hami
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      PUBLIC_PORT: 443
      REALITY_PRIVATE_KEY: ${REALITY_PRIVATE_KEY}
      REALITY_PUBLIC_KEY: ${REALITY_PUBLIC_KEY}
      REALITY_SHORT_ID: ${REALITY_SHORT_ID}
      REALITY_SERVER_NAMES: ${REALITY_SERVER_NAMES}
      MTG_SECRET: ${MTG_SECRET}
      MTG_PORT: 3128
      MTG_ADTAG: ${MTG_ADTAG:-}
    ports:
      - "8444:8444"   # vless-reality
      - "8447:8447"   # trojan-reality
      - "8448:8448"   # shadowsocks
    volumes:
      - xray_data:/etc/xray
    depends_on:
      - db
    networks: [hami]

  nginx:
    image: nginx:alpine
    container_name: hami-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - panel
    network_mode: "service:panel"

  db:
    image: postgres:16-alpine
    container_name: hami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hami
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [hami]

  mtg:
    image: nineseconds/mtg:2
    container_name: hami-mtg
    restart: unless-stopped
    command: ["simple-run", "${MTG_SECRET}"]
    ports:
      - "3128:3128"
    environment:
      - MTG_ADTAG=${MTG_ADTAG:-}
    networks: [hami]

networks:
  hami:

volumes:
  db_data:
  xray_data: